services:
  body-system:
    build:
      context: ..
      dockerfile: src/Services/BodySystem/Sas.BodySystem.Process/Dockerfile
      args:
        BUILD_CONFIGURATION: ${SAS_BODYSYSTEM_BUILD_CONFIGURATION:-Release}
    environment:
      ConnectionStrings__Default: "Server=sql-server;Database=SasBodyDatabase;User ID=sa;Password=${SAS_SQL_PASSWORD:-SasComposeDev!42};Encrypt=True;TrustServerCertificate=True"
      Body__EnsureDatabaseCreated: "true"
      Notification__Url: "http://notification:3737/notification"
    ports:
      - "127.0.0.1:${SAS_BODYSYSTEM_PORT:-3742}:3742"
    depends_on:
      sql-server:
        condition: service_healthy
      notification:
        condition: service_started

  notification:
    build:
      context: ..
      dockerfile: src/Services/Notification/Sas.Notification.Process/Dockerfile
    ports:
      - "127.0.0.1:${SAS_NOTIFICATION_PORT:-3737}:3737"

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SAS_SQL_PASSWORD:-SasComposeDev!42}"
    volumes:
      - body-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  body-data:
